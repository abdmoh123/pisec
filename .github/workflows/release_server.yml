name: release-server

on:
  push:
    tags:
      - "server/v*.*.*"

permissions:
  contents: read

jobs:
  test_server:
    uses: ./.github/workflows/test_server.yml

  build:
    needs: test_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
            version: 2026.3.10
      - run: mise run init
      - run: mise run build

      - uses: actions/upload-artifact@v4
        with:
          name: release-files.server
          path: server/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Parse version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#server/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-*]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-files.server
          path: artifacts

      - name: extract changes from changelog
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          python3 ".github/scripts/read_changelog" "$VERSION" "server/CHANGELOG.md" > "RELEASE_NOTES.md"

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Create a prerelease release if tag is a release candidate
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "RELEASE_NOTES.md" \
            --verify-tag \
            $flags
