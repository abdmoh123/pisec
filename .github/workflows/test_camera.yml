name: test-camera

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./camera
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.3.10
      - run: mise run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./camera
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
            version: 2026.3.10
      - run: mise run test
