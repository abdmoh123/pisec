name: release-client

on:
  push:
    tags:
      - "client/v*.*.*"

permissions:
  contents: read

jobs:
  test_client:
    uses: ./.github/workflows/test_client.yml

  build:
    needs: test_client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Parse version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#client/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-*]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: jdx/mise-action@v4
        with:
            version: 2026.3.10

      - name: initalise flutter dependencies
        run: mise run restore

      - name: setup android tooling
        run: mise run install-android-tools

      - name: build android app
        run: mise run build android

      - name: create artifacts directory
        run: mkdir -p artifacts

      - name: copy built apk to artifact folder
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
            artifacts/pisec-${{ steps.version.outputs.tag }}.apk

      - name: install required packages for linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            pkg-config \
            clang \
            cmake \
            ninja-build \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: build linux app
        run: mise run build linux

      - name: bundle up linux app into tarball
        run: |
          tar -czf pisec-${{ steps.version.outputs.tag }}-linux-x64.tar.gz \
            -C build/linux/x64/release/bundle \
            .
          mv pisec-${{ steps.version.outputs.tag }}-linux-x64.tar.gz artifacts/

      - name: upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files.client
          path: client/artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Parse version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#client/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-*]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-files.client
          path: artifacts

      - name: create sha256 checksums
        run: cd artifacts && sha256sum *.tar.gz *.apk > sha256sums.txt

      - name: extract changes from changelog
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          python3 ".github/scripts/read_changelog" "$VERSION" "client/CHANGELOG.md" > "RELEASE_NOTES.md"

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Create a prerelease release if tag is a release candidate
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "RELEASE_NOTES.md" \
            --verify-tag \
            $flags
