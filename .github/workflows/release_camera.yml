name: release-camera

on:
  push:
    tags:
      - "camera/v*.*.*"

env:
  REGISTRY: "ghcr.io"

permissions:
  contents: read

jobs:
  test_camera:
    uses: ./.github/workflows/test_camera.yml

  build:
    needs: test_camera
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./camera
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
            version: 2026.3.10

      - run: mise run init

      - run: mise run build

      - uses: actions/upload-artifact@v4
        with:
          name: release-files.camera
          path: camera/dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse version
        id: version
        uses: ./.github/actions/parse-version
        with:
          prefix: camera

      - uses: actions/download-artifact@v4
        with:
          name: release-files.camera
          path: artifacts

      - name: extract changes from changelog
        run: |
          CHANGELOG_VERSION="${{ steps.version.outputs.tag }}"
          python3 ".github/scripts/read_changelog" "$CHANGELOG_VERSION" "camera/CHANGELOG.md" > "RELEASE_NOTES.md"

      - name: create github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          # Create a prerelease release if tag is a release candidate
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "RELEASE_NOTES.md" \
            --verify-tag \
            $flags

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    defaults:
      run:
        working-directory: ./camera
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse version
        id: version
        uses: ./.github/actions/parse-version
        with:
          prefix: camera

      - name: Set up docker build
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub registry
        uses: docker/login-action@v3
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set tags
        id: meta
        uses: docker/metadata-action@v3
        with:
          images: "${{ env.REGISTRY }}/${{ github.repository_owner }}/pisec-cam"
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=sha
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and push to GitHub
        uses: docker/build-push-action@v6
        with:
          context: ./camera
          file: ./camera/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
