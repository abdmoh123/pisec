[tools]
android-sdk = "latest"
cmake = "latest"
flutter = { version = "3.47.7", platforms = { linux-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version }}-stable.tar.xz" }, macos-arm64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_{{ version }}-stable.zip" }, macos-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_{{ version }}-stable.zip" }, windows-x64 = { url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_{{ version }}-stable.zip" } }, version_expr = 'fromJSON(body).releases | filter({ #.channel == "stable" }) | map({ replace(#.version, "-stable", "") }) | sortVersions()', version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json", url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_{{ version }}-stable.zip", version_json_path = ".releases[?channel=stable].version" }
java = "21.0.0"
ninja = "latest"
oxipng = "latest"

[env]
# You override these in mise.local.toml (must copy the _.path part too)
ANDROID_HOME = "{{env.HOME}}/Android"
ANDROID_SDK_ROOT = "{{env.ANDROID_HOME}}"
_.file = ".env"
_.path = [
    "{{env.ANDROID_HOME}}/cmdline-tools/latest/bin",
    "{{env.ANDROID_HOME}}/platform-tools",
    "{{env.ANDROID_HOME}}/emulator",
]

[tasks.start]
description = "Run the flutter app"
usage = '''
arg <platform> default="web" help="Which platform to run on" { choices "android" "linux" "web" }
flag "-v --verbose" help="Run in verbose mode" global=#true count=#true
flag "-r --release" help="Run in release mode, will run in debug mode if this isn't defined"
flag "-n --dry-run" help="Output what command would be run"
flag "--profile" help="Run in profiling mode"
flag "--wasm" help="Compile to WebAssembly (only for web platform)"
'''
run = '''
#!/usr/bin/env bash
case "$usage_platform" in
    android) device="$ANDROID_DEVICE_NAME" ;;
    linux) device="linux" ;;
    web) device="web-server --web-port 8080" ;;
esac

CMD="flutter run -d $device"

# Propagate verbosity level
VERBOSITY="-"
if [ -n "${usage_verbose}" ]; then
    for i in $(seq 1 "${usage_verbose}"); do
        VERBOSITY="${VERBOSITY}v"
    done
fi

[ -n "${usage_release}" ] && CMD="$CMD --release"
[ -z "${usage_release}" ] && CMD="$CMD --debug"
[ -n "${usage_profile}" ] && CMD="$CMD --profile"

# Web assembly can only work for the web platform
[ "$usage_platform" = "web" ] && [ -n "${usage_wasm}" ] && CMD="$CMD --wasm"

[ -n "${usage_verbose}" ] && CMD="$CMD $VERBOSITY"

if [ -n "${usage_dry_run}" ]; then
    echo "$CMD"
    exit 0
fi

$CMD
'''

[tasks.build]
description = "Build the flutter app"
usage = '''
arg <platform> default="android" help="Which platform to build for" { choices "android" "linux" }
flag "-v --verbose" help="Run in verbose mode" global=#true count=#true
flag "-d --debug" help="Build in debug mode, will build in release if this isn't defined"
flag "-n --dry-run" help="Output what command would be run"
flag "--build-number <buildnumber>" help="Unique identifier to differentiate from previous builds"
flag "--build-name <buildname>" help="Semantic versioning based build number (major.minor.patch)"
'''
run = '''
#!/usr/bin/env bash
case "$usage_platform" in
    android) target="apk" ;;
    linux) target="linux" ;;
esac

CMD="flutter build $target"

# Propagate verbosity level
VERBOSITY="-"
if [ -n "${usage_verbose}" ]; then
    for i in $(seq 1 "${usage_verbose}"); do
        VERBOSITY="${VERBOSITY}v"
    done
fi

# Add flags if they're set
[ -z "${usage_debug}" ] && CMD="$CMD --release"
[ -n "${usage_debug}" ] && CMD="$CMD --debug"
[ -n "${usage_verbose}" ] && CMD="$CMD $VERBOSITY"
[ -n "${usage_build_number}" ] && CMD="$CMD --build-number ${usage_build_number}"
[ -n "${usage_build_name}" ] && CMD="$CMD --build-name ${usage_build_name}"

if [ -n "${usage_dry_run}" ]; then
    echo "$CMD"
    exit 0
fi

$CMD
'''

[tasks.clean]
description = "Clean the flutter project"
run = "flutter clean"

[tasks.setup-mocks]
description = "Setup the mock stubs for the tests"
run = "dart run build_runner build"

[tasks.test]
description = "Run the flutter tests"
usage = '''
flag "-v --verbose" help="Run in verbose mode" global=#true count=#true
flag "-n --dry-run" help="Output what command would be run"
flag "--wasm" help="Compile to WebAssembly"
'''
run = '''
CMD="flutter test"

# Propagate verbosity level
VERBOSITY="-"
if [ -n "${usage_verbose}" ]; then
    for i in $(seq 1 "${usage_verbose}"); do
        VERBOSITY="${VERBOSITY}v"
    done
fi

[ -n "${usage_wasm}" ] && CMD="$CMD --wasm"
[ -n "${usage_verbose}" ] && CMD="$CMD $VERBOSITY"

if [ -n "${usage_dry_run}" ]; then
    echo "$CMD"
    exit 0
fi

$CMD
'''

[tasks.restore]
description = "Install the flutter dependencies"
run = "flutter pub get"

[tasks.lint]
description = "Run the dart linter"
run = "dart analyze"

[tasks.install-android-tools]
description = "Installs required android tools"
run = '''
#!/usr/bin/env bash
set -euo pipefail

android --no-metrics sdk install "platform-tools" "platforms/android-36" "build-tools/28.0.3" "cmdline-tools/latest" "emulator"
'''
