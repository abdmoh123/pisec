[env]
_.file = ".env"
DOCKER_PATH = "/usr/bin/docker"

[tools]
uv = "0.13.5"

[tasks.init]
description = "Initialize the project and install all dependencies"
run = """
#!/usr/bin/env bash
uv python install
uv sync --frozen --dev
"""

[tasks.build]
description = "Builds the python wheel"
usage = '''
arg "<platform>" default="wheel" help="Type of build" { choices "wheel" "image" }
flag "--env-file <envfile>" help="Which env file to use" default="./.env"
flag "-v --verbose" help="Run in verbose mode (only when building wheel)"
flag "-n --dry-run" help="Output what command would be run"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Add verbose flag if specified
EXTRA_ARGS=""
if [ "${usage_verbose:-false}" = "true" ]; then
    EXTRA_ARGS=" --verbose"
fi

# Choose type of build
case "$usage_platform" in
    wheel) CMD="uv build$EXTRA_ARGS" ;;
    image) CMD="$DOCKER_PATH build ." ;;
esac

# Print the command if dry running instead of running the command
if [ "${usage_dry_run:-false}" = "true" ]; then
    echo $CMD
    exit 0
fi

# Export env variables
set -a
source $usage_env_file
set +a

$CMD
'''

[tasks.start]
description = "Start the fastapi server"
usage = '''
arg "<environment>" help="Target environment" default="prod" { choices "dev" "prod" }
flag "-v --verbose" help="Run in verbose mode"
'''
depends = "init"
run = '''
#!/usr/bin/env bash
if [ ${usage_environment} = "dev" ]; then
    fastapi dev --reload ${usage_verbose} src/pisec_server/main.py
else
    fastapi run ${usage_verbose} src/pisec_server/main.py
fi
'''
quiet = true

[tasks.ruff]
description = "Run ruff linter"
depends = "init"
run = "uv run ruff check ."
hide = true

[tasks.mypy]
description = "Run mypy linter"
depends = "init"
run = "uv run mypy ."
hide = true

[tasks.pyright]
description = "Run basedpyright linter"
depends = "init"
run = "uv run basedpyright"
hide = true

[tasks.check-format]
description = "Check if code is formatted"
depends = "init"
run = "uv run ruff format --check"

[tasks.lint]
description = "Run linters"
run = [
    { tasks = [ 'ruff', 'mypy', 'pyright' ] },
]

[tasks.test]
description = "Run tests"
depends = "init"
run = "uv run pytest"

[tasks.check]
description = "Run linters and tests"
run = [
    { task = 'check-format' },
    { task = 'lint' },
    { task = 'test' }
]

[tasks.clean]
description = "Clean the project"
run = """
#!/usr/bin/env bash
uv clean
find . -type d -name "*cache" -exec rm -r {} +
find . -type d -name "__pycache__" -exec rm -rf {} + && find . -name "*.pyc" -delete
"""

[settings]
python.uv_venv_auto = "create|source"
