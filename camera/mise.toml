[env]
_.file = ".env"
DATA_DIR = "data/"

[tools]
uv = "0.10.0"

[tasks.init]
description = "Initialize the project and install all dependencies"
run = """
#!/usr/bin/env bash
uv python install
uv sync --frozen --dev
"""

[tasks.build]
description = "Builds the python wheel"
run = "uv build"

[tasks.ruff]
description = "Run ruff linter"
depends = "init"
run = "uv run ruff check"
hide = true

[tasks.mypy]
description = "Run mypy linter"
depends = "init"
run = "uv run mypy ."
hide = true

[tasks.pyright]
description = "Run basedpyright linter"
depends = "init"
run = "uv run basedpyright ."
hide = true

[tasks.check-format]
description = "Check if code is formatted"
depends = "init"
run = "uv run ruff format --check"

[tasks.lint]
description = "Run linters"
run = [
    { tasks = [ 'ruff', 'mypy', 'pyright' ] },
]

[tasks.test]
description = "Run tests"
depends = "init"
run = "uv run pytest"

[tasks.check]
description = "Check format, lint and test the codebase"
run = [
    { task = 'check-format' },
    { task = 'lint' },
    { task = 'test' }
]

[tasks.clean]
description = "Clean the project"
run = """
#!/usr/bin/env bash
uv clean
find . -type d -name "*cache" -exec rm -r {} +
find . -type d -name "__pycache__" -exec rm -rf {} + && find . -name "*.pyc" -delete
"""

[settings]
python.uv_venv_auto = "create|source"
